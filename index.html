<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Room Grid Studio</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    }
  }
  </script>
  <style>
    :root {
      --ink: #1f2527;
      --muted: #687174;
      --paper: #f6f3ec;
      --panel: #fffdf8;
      --line: #d8d0c0;
      --strong: #315c5a;
      --strong-2: #d96f4c;
      --danger: #b43d31;
      --shadow: 0 18px 42px rgba(31, 37, 39, .12);
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
      font-family: "Segoe UI", "Noto Sans KR", system-ui, sans-serif;
    }

    button, input, select {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fffaf1;
      color: var(--ink);
      min-height: 36px;
      padding: 0 12px;
      cursor: pointer;
    }

    button:hover { border-color: var(--strong); }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid rgba(49, 92, 90, .28); outline-offset: 2px; }
    button:disabled { opacity: .45; cursor: not-allowed; }

    .app {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr) 300px;
      min-height: 100vh;
    }

    .panel {
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 18px;
      overflow: auto;
    }

    .side-right {
      border-right: 0;
      border-left: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 22px;
      line-height: 1.05;
      margin: 0;
      letter-spacing: 0;
    }

    h2 {
      font-size: 15px;
      margin: 24px 0 10px;
    }

    .badge {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 9px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    label {
      display: grid;
      gap: 5px;
      font-size: 12px;
      color: var(--muted);
    }

    input[type="number"], input[type="text"], select {
      width: 100%;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--ink);
      padding: 7px 9px;
    }

    input[type="color"] {
      width: 100%;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      padding: 3px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .primary {
      background: var(--strong);
      color: white;
      border-color: var(--strong);
    }

    .accent {
      background: var(--strong-2);
      color: white;
      border-color: var(--strong-2);
    }

    .danger {
      color: white;
      background: var(--danger);
      border-color: var(--danger);
    }

    .workspace {
      min-width: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 253, 248, .76);
      backdrop-filter: blur(8px);
    }

    .tabs {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fffaf1;
    }

    .tabs button {
      border: 0;
      min-height: 30px;
      background: transparent;
    }

    .tabs button[aria-pressed="true"] {
      background: var(--ink);
      color: white;
    }

    .meta {
      font-size: 12px;
      color: var(--muted);
    }

    .stage-wrap {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      padding: 24px;
    }

    .stage {
      position: relative;
      width: var(--room-w, 720px);
      height: var(--room-d, 540px);
      min-width: 180px;
      min-height: 180px;
      margin: 0 auto;
      border: 2px solid var(--ink);
      background-color: #fffdf8;
      background-image:
        linear-gradient(to right, rgba(49, 92, 90, .16) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(49, 92, 90, .16) 1px, transparent 1px);
      background-size: var(--grid, 12px) var(--grid, 12px);
      box-shadow: var(--shadow);
    }

    .item {
      position: absolute;
      left: 0;
      top: 0;
      width: var(--w);
      height: var(--d);
      transform: translate(var(--x), var(--y));
      border: 2px solid rgba(31, 37, 39, .72);
      border-radius: 6px;
      background: var(--c);
      display: grid;
      place-items: center;
      color: rgba(0, 0, 0, .72);
      font-size: 12px;
      font-weight: 700;
      overflow: visible;
      touch-action: none;
      user-select: none;
      cursor: grab;
    }

    .item-label {
      display: block;
      max-width: 100%;
      max-height: 100%;
      padding: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      pointer-events: none;
    }

    .resize-handle {
      position: absolute;
      z-index: 5;
      width: 20px;
      height: 20px;
      border: 2px solid var(--strong-2);
      border-radius: 50%;
      background: #fffdf8;
      box-shadow: 0 2px 6px rgba(31, 37, 39, .22);
      touch-action: none;
    }

    .resize-handle[data-corner="nw"] { left: -11px; top: -11px; cursor: nwse-resize; }
    .resize-handle[data-corner="ne"] { right: -11px; top: -11px; cursor: nesw-resize; }
    .resize-handle[data-corner="sw"] { left: -11px; bottom: -11px; cursor: nesw-resize; }
    .resize-handle[data-corner="se"] { right: -11px; bottom: -11px; cursor: nwse-resize; }

    .item[aria-selected="true"] {
      outline: 3px solid var(--strong-2);
      outline-offset: 2px;
      z-index: 2;
    }

    .item[data-overlap="true"] {
      border-color: var(--danger);
      box-shadow: inset 0 0 0 3px rgba(180, 61, 49, .18);
    }

    .item:active { cursor: grabbing; }

    .door2d {
      position: absolute;
      z-index: 4;
      min-height: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: var(--door-color);
      overflow: visible;
    }

    .door2d[data-wall="back"] {
      left: var(--door-offset);
      top: -5px;
      width: var(--door-size);
      height: 10px;
    }

    .door2d[data-wall="left"] {
      left: -5px;
      top: var(--door-offset);
      width: 10px;
      height: var(--door-size);
    }

    .door2d[aria-selected="true"] {
      outline: 3px solid var(--strong-2);
      outline-offset: 3px;
    }

    .door-leaf-2d {
      position: absolute;
      display: block;
      background: var(--door-color);
      transform-origin: var(--hinge-x) var(--hinge-y);
    }

    .door2d[data-wall="back"] .door-leaf-2d {
      left: 0;
      top: 4px;
      width: 100%;
      height: 3px;
      transform: rotate(var(--door-angle));
    }

    .door2d[data-wall="left"] .door-leaf-2d {
      left: 4px;
      top: 0;
      width: 3px;
      height: 100%;
      transform: rotate(var(--door-angle));
    }

    .door-tag {
      position: absolute;
      padding: 2px 5px;
      border: 1px solid rgba(31, 37, 39, .25);
      border-radius: 4px;
      background: rgba(255, 253, 248, .94);
      color: var(--ink);
      font-size: 10px;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
      pointer-events: none;
    }

    .door2d[data-wall="back"] .door-tag { left: 50%; top: 12px; transform: translateX(-50%); }
    .door2d[data-wall="left"] .door-tag { left: 12px; top: 50%; transform: translateY(-50%); }

    .viewer3d {
      display: none;
      position: relative;
      min-height: 0;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      user-select: none;
      background:
        linear-gradient(180deg, #eef2ed 0%, #f6f3ec 50%, #ded7ca 100%);
    }

    .viewer3d.active { display: block; }
    .viewer3d.dragging { cursor: grabbing; }

    #threeCanvas {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 520px;
      outline: none;
      touch-action: none;
    }

    .three-status {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 2;
      max-width: min(420px, calc(100% - 40px));
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 253, 248, .94);
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      transform: translate(-50%, -50%);
    }

    .view-controls {
      position: absolute;
      left: 18px;
      bottom: 18px;
      z-index: 3;
      display: grid;
      gap: 8px;
      width: min(430px, calc(100% - 36px));
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 253, 248, .9);
      box-shadow: var(--shadow);
    }

    .view-help {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .zoom-controls {
      display: inline-grid;
      grid-template-columns: 38px 58px 38px;
      gap: 4px;
      align-items: center;
    }

    .zoom-controls button {
      min-width: 38px;
      padding: 0;
      font-size: 20px;
      line-height: 1;
    }

    .zoom-value {
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    .door-list-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
    }

    .door-list-row > button:first-child {
      grid-template-columns: 1fr;
    }

    .door-list-row .danger {
      color: var(--ink);
    }

    .list {
      display: grid;
      gap: 8px;
    }

    .list button {
      display: grid;
      grid-template-columns: 20px 1fr;
      gap: 8px;
      align-items: center;
      text-align: left;
      min-height: 42px;
      background: #fff;
    }

    .swatch {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 1px solid rgba(31,37,39,.3);
      background: var(--c);
    }

    .empty {
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      padding: 14px;
      font-size: 13px;
      line-height: 1.5;
    }

    .hidden { display: none; }

    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      .panel, .side-right { border: 0; border-bottom: 1px solid var(--line); }
      .workspace { min-height: 620px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="panel">
      <div class="brand">
        <h1>Room Grid<br>Studio</h1>
        <span class="badge">10mm grid</span>
      </div>

      <h2>방 크기</h2>
      <div class="field-grid">
        <label>가로 mm <input id="roomWidth" type="number" min="100" step="10" value="3600"></label>
        <label>세로 mm <input id="roomDepth" type="number" min="100" step="10" value="3000"></label>
        <label>높이 mm <input id="roomHeight" type="number" min="100" step="10" value="2400"></label>
      </div>
      <div class="actions">
        <button class="primary" id="applyRoom">방 적용</button>
        <button id="fitRoom">화면 맞춤</button>
      </div>

      <h2>저장</h2>
      <div class="actions">
        <button id="savePlan">저장</button>
        <button id="loadPlan">불러오기</button>
        <button id="resetPlan">초기화</button>
      </div>

      <h2>가구 추가</h2>
      <div class="field-grid">
        <label style="grid-column:1 / -1">이름 <input id="fName" type="text" value="수납장"></label>
        <label>가로 mm <input id="fWidth" type="number" min="10" step="10" value="800"></label>
        <label>세로 mm <input id="fDepth" type="number" min="10" step="10" value="450"></label>
          <label>높이 mm (수치) <input id="fHeight" type="number" min="10" step="10" value="900"></label>
        <label>고도 mm <input id="fZ" type="number" min="0" step="10" value="0"></label>
        <label>색상 <input id="fColor" type="color" value="#8fb6a8"></label>
        <label>3D 모델
          <select id="fModel">
            <option value="box">기본 박스</option>
            <option value="chair">의자 (GLB)</option>
            <option value="sofa">소파 (GLB)</option>
            <option value="pouf">푸프 (GLB)</option>
          </select>
        </label>
        <label>모델 색상
          <select id="fFinish">
            <option value="tint">선택 색상 적용</option>
            <option value="original">원본 재질 유지</option>
          </select>
        </label>
      </div>
      <div class="actions">
        <button class="accent" id="addFurniture">가구 추가</button>
      </div>

      <h2>출입문 추가</h2>
      <div class="field-grid">
        <label style="grid-column:1 / -1">이름 <input id="dName" type="text" value="출입문"></label>
        <label>설치 벽
          <select id="dWall">
            <option value="back">뒷벽</option>
            <option value="left">왼쪽 벽</option>
          </select>
        </label>
        <label>벽 시작점부터 mm <input id="dOffset" type="number" min="0" step="10" value="300"></label>
        <label>문 폭 mm <input id="dWidth" type="number" min="100" step="10" value="900"></label>
        <label>문 높이 mm <input id="dHeight" type="number" min="100" step="10" value="2100"></label>
        <label>경첩
          <select id="dHinge">
            <option value="start">시작점 쪽</option>
            <option value="end">끝점 쪽</option>
          </select>
        </label>
        <label>열림 방향
          <select id="dSwing">
            <option value="in">방 안쪽</option>
            <option value="out">방 바깥쪽</option>
          </select>
        </label>
        <label>색상 <input id="dColor" type="color" value="#b9855b"></label>
      </div>
      <div class="actions">
        <button class="accent" id="addDoor">출입문 추가</button>
      </div>
    </aside>

    <section class="workspace">
      <div class="toolbar">
        <div class="tabs" role="group" aria-label="보기 전환">
          <button id="tab2d" type="button" aria-pressed="true">2D</button>
          <button id="tab3d" type="button" aria-pressed="false">3D 변환</button>
        </div>
        <div class="meta" id="roomMeta"></div>
      </div>
      <div class="stage-wrap" id="stageWrap">
        <div class="stage" id="stage" aria-label="2D 방 배치판"></div>
      </div>
      <div class="viewer3d" id="viewer3d" aria-label="3D 방 보기">
        <div class="view-controls" aria-label="3D 보기 제어">
          <div class="view-help">한 손가락: 회전 · 두 손가락: 이동·확대 · PC Shift/오른쪽 드래그: 이동</div>
          <div class="actions">
            <div class="zoom-controls" aria-label="화면 확대·축소">
              <button id="zoomOut" type="button" title="축소" aria-label="축소">−</button>
              <span class="zoom-value" id="zoomValue" aria-live="polite">100%</span>
              <button id="zoomIn" type="button" title="확대" aria-label="확대">+</button>
            </div>
            <button id="resetView">보기 초기화</button>
          </div>
        </div>
        <canvas id="threeCanvas" tabindex="0" aria-label="Three.js 3D 방 화면"></canvas>
        <div class="three-status" id="threeStatus">3D 엔진을 불러오는 중입니다.</div>
      </div>
    </section>

    <aside class="panel side-right">
      <h2>선택 가구 수정</h2>
      <div id="editorEmpty" class="empty">가구를 추가한 뒤 2D 배치판이나 목록에서 선택하세요.</div>
      <div id="editor" class="hidden">
        <div class="field-grid">
          <label style="grid-column:1 / -1">이름 <input id="eName" type="text"></label>
          <label>X mm <input id="eX" type="number" min="0" step="10"></label>
          <label>Y mm <input id="eY" type="number" min="0" step="10"></label>
          <label>가로 mm <input id="eWidth" type="number" min="10" step="10"></label>
          <label>세로 mm <input id="eDepth" type="number" min="10" step="10"></label>
          <label>높이 mm (수치) <input id="eHeight" type="number" min="10" step="10"></label>
          <label>고도 mm <input id="eZ" type="number" min="0" step="10"></label>
          <label>색상 <input id="eColor" type="color"></label>
          <label>3D 모델
            <select id="eModel">
              <option value="box">기본 박스</option>
              <option value="chair">의자 (GLB)</option>
              <option value="sofa">소파 (GLB)</option>
              <option value="pouf">푸프 (GLB)</option>
            </select>
          </label>
          <label>모델 색상
            <select id="eFinish">
              <option value="tint">선택 색상 적용</option>
              <option value="original">원본 재질 유지</option>
            </select>
          </label>
        </div>
        <div class="actions">
          <button class="primary" id="updateFurniture">수정 적용</button>
          <button id="rotateFurniture">90도 회전</button>
          <button class="danger" id="deleteFurniture">삭제</button>
        </div>
      </div>

      <h2>가구 목록</h2>
      <div class="list" id="list"></div>

      <h2>선택 출입문 수정</h2>
      <div id="doorEditorEmpty" class="empty">2D 배치판이나 출입문 목록에서 문을 선택하세요.</div>
      <div id="doorEditor" class="hidden">
        <div class="field-grid">
          <label style="grid-column:1 / -1">이름 <input id="edName" type="text"></label>
          <label>설치 벽
            <select id="edWall">
              <option value="back">뒷벽</option>
              <option value="left">왼쪽 벽</option>
            </select>
          </label>
          <label>벽 시작점부터 mm <input id="edOffset" type="number" min="0" step="10"></label>
          <label>문 폭 mm <input id="edWidth" type="number" min="100" step="10"></label>
          <label>문 높이 mm <input id="edHeight" type="number" min="100" step="10"></label>
          <label>경첩
            <select id="edHinge">
              <option value="start">시작점 쪽</option>
              <option value="end">끝점 쪽</option>
            </select>
          </label>
          <label>열림 방향
            <select id="edSwing">
              <option value="in">방 안쪽</option>
              <option value="out">방 바깥쪽</option>
            </select>
          </label>
          <label>색상 <input id="edColor" type="color"></label>
        </div>
        <div class="actions">
          <button class="primary" id="updateDoor">문 수정 적용</button>
          <button class="danger" id="deleteDoor">문 삭제</button>
        </div>
      </div>

      <h2>출입문 목록</h2>
      <div class="list" id="doorList"></div>
    </aside>
  </main>

  <script>
    const state = {
      room: { width: 3600, depth: 3000, height: 2400 },
      scale: 0.18,
      items: [],
      doors: [],
      selectedId: null,
      selectedDoorId: null,
      mode: "2d",
      status: "",
      view: { x: 62, z: -38, panX: 0, panY: 0, zoom: 1 }
    };

    const storageKey = "room-grid-studio-plan";
    const furnitureModels = {
      chair: {
        name: "의자",
        url: "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/SheenChair/glTF-Binary/SheenChair.glb"
      },
      sofa: {
        name: "소파",
        url: "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/SheenWoodLeatherSofa/glTF-Binary/SheenWoodLeatherSofa.glb"
      },
      pouf: {
        name: "푸프",
        url: "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/SpecularSilkPouf/glTF-Binary/SpecularSilkPouf.glb"
      }
    };
    let threeApp = null;
    const $ = (id) => document.getElementById(id);
    const snap = (value) => Math.round(value / 10) * 10;
    const px = (mm) => `${mm * state.scale}px`;

    function clampItem(item) {
      item.width = Math.max(10, snap(item.width));
      item.depth = Math.max(10, snap(item.depth));
      item.height = Math.max(10, snap(item.height));
      item.z = Math.min(Math.max(0, snap(item.z || 0)), Math.max(0, state.room.height - item.height));
      item.x = Math.min(Math.max(0, snap(item.x)), Math.max(0, state.room.width - item.width));
      item.y = Math.min(Math.max(0, snap(item.y)), Math.max(0, state.room.depth - item.depth));
      item.model = furnitureModels[item.model] ? item.model : "box";
      item.finish = item.finish === "original" ? "original" : "tint";
      item.rotation = [0, 90, 180, 270].includes(item.rotation) ? item.rotation : 0;
      return item;
    }

    function wallLength(wall) {
      return wall === "left" ? state.room.depth : state.room.width;
    }

    function clampDoor(door) {
      door.wall = door.wall === "left" ? "left" : "back";
      door.name = String(door.name || "출입문");
      door.color = /^#[0-9a-f]{6}$/i.test(door.color || "") ? door.color : "#b9855b";
      const length = wallLength(door.wall);
      door.width = Math.min(length, Math.max(100, snap(door.width || 900)));
      door.height = Math.min(state.room.height, Math.max(100, snap(door.height || 2100)));
      door.offset = Math.min(Math.max(0, snap(door.offset || 0)), Math.max(0, length - door.width));
      door.hinge = door.hinge === "end" ? "end" : "start";
      door.swing = door.swing === "out" ? "out" : "in";
      return door;
    }

    function setScaleToFit() {
      const wrap = $("stageWrap");
      const availableW = Math.max(280, wrap.clientWidth - 64);
      const availableH = Math.max(280, wrap.clientHeight - 64);
      state.scale = Math.min(0.28, availableW / state.room.width, availableH / state.room.depth);
      state.scale = Math.max(0.04, state.scale);
      render();
    }

    function render() {
      const gridPx = Math.max(4, 10 * state.scale);
      const overlapCount = countOverlaps();
      document.documentElement.style.setProperty("--grid", `${gridPx}px`);
      document.documentElement.style.setProperty("--room-w", px(state.room.width));
      document.documentElement.style.setProperty("--room-d", px(state.room.depth));
      document.documentElement.style.setProperty("--wall-h", px(state.room.height));
      $("roomMeta").textContent = `${state.room.width} x ${state.room.depth} x ${state.room.height} mm${overlapCount ? " · 겹침 " + overlapCount + "건" : ""}${state.status ? " · " + state.status : ""}`;

      render2d();
      render3d();
      renderList();
      renderEditor();
      renderDoorList();
      renderDoorEditor();
      $("stageWrap").classList.toggle("hidden", state.mode !== "2d");
      $("viewer3d").classList.toggle("active", state.mode === "3d");
      $("tab2d").setAttribute("aria-pressed", state.mode === "2d");
      $("tab3d").setAttribute("aria-pressed", state.mode === "3d");
    }

    function render2d() {
      const stage = $("stage");
      stage.replaceChildren();
      state.items.forEach((item) => {
        const el = document.createElement("button");
        el.type = "button";
        el.className = "item";
        el.dataset.id = item.id;
        el.style.setProperty("--x", px(item.x));
        el.style.setProperty("--y", px(item.y));
        el.style.setProperty("--w", px(item.width));
        el.style.setProperty("--d", px(item.depth));
        el.style.setProperty("--c", item.color);
        el.setAttribute("aria-selected", item.id === state.selectedId);
        el.dataset.overlap = hasOverlap(item);
        const label = document.createElement("span");
        label.className = "item-label";
        label.textContent = item.name;
        el.appendChild(label);
        if (item.id === state.selectedId) {
          ["nw", "ne", "sw", "se"].forEach((corner) => {
            const handle = document.createElement("span");
            handle.className = "resize-handle";
            handle.dataset.corner = corner;
            handle.setAttribute("aria-hidden", "true");
            handle.addEventListener("pointerdown", startResize);
            el.appendChild(handle);
          });
        }
        el.addEventListener("pointerdown", startDrag);
        el.addEventListener("click", () => selectItem(item.id));
        stage.appendChild(el);
      });
      state.doors.forEach((door) => {
        const el = document.createElement("button");
        el.type = "button";
        el.className = "door2d";
        el.dataset.wall = door.wall;
        el.style.setProperty("--door-offset", px(door.offset));
        el.style.setProperty("--door-size", px(door.width));
        el.style.setProperty("--door-color", door.color);
        el.style.setProperty("--hinge-x", door.hinge === "start" ? "0%" : "100%");
        el.style.setProperty("--hinge-y", door.hinge === "start" ? "0%" : "100%");
        el.style.setProperty("--door-angle", `${doorAngle(door, 90)}deg`);
        el.setAttribute("aria-label", `${door.name} 선택`);
        el.setAttribute("aria-selected", door.id === state.selectedDoorId);
        const leaf = document.createElement("span");
        leaf.className = "door-leaf-2d";
        const tag = document.createElement("span");
        tag.className = "door-tag";
        tag.textContent = door.name;
        el.append(leaf, tag);
        el.addEventListener("click", () => selectDoor(door.id));
        stage.appendChild(el);
      });
    }

    function render3d() {
      if (!threeApp) return;
      threeApp.markDirty();
      if (state.mode === "3d") {
        threeApp.rebuild();
        requestAnimationFrame(threeApp.resize);
      }
    }

    function doorAngle(door, amount) {
      const inward = door.wall === "back"
        ? (door.hinge === "start" ? amount : -amount)
        : (door.hinge === "start" ? -amount : amount);
      return door.swing === "in" ? inward : -inward;
    }

    function renderList() {
      const list = $("list");
      list.replaceChildren();
      if (!state.items.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "아직 추가된 가구가 없습니다.";
        list.appendChild(empty);
        return;
      }
      state.items.forEach((item) => {
        const row = document.createElement("button");
        row.type = "button";
        row.dataset.id = item.id;
        const swatch = document.createElement("span");
        swatch.className = "swatch";
        swatch.style.setProperty("--c", item.color);
        const content = document.createElement("span");
        content.append(document.createTextNode(`${item.name}${hasOverlap(item) ? " · 겹침" : ""}`), document.createElement("br"));
        const detail = document.createElement("small");
        const modelName = furnitureModels[item.model]?.name || "기본 박스";
        detail.textContent = `${item.width} x ${item.depth} x ${item.height} mm · 고도 ${item.z || 0} mm · ${modelName}`;
        content.appendChild(detail);
        row.append(swatch, content);
        row.addEventListener("click", () => selectItem(item.id));
        list.appendChild(row);
      });
    }

    function renderEditor() {
      const item = selectedItem();
      $("editor").classList.toggle("hidden", !item);
      $("editorEmpty").classList.toggle("hidden", !!item);
      if (!item) return;
      $("eName").value = item.name;
      $("eX").value = item.x;
      $("eY").value = item.y;
      $("eWidth").value = item.width;
      $("eDepth").value = item.depth;
      $("eHeight").value = item.height;
      $("eZ").value = item.z || 0;
      $("eColor").value = item.color;
      $("eModel").value = item.model || "box";
      $("eFinish").value = item.finish || "tint";
    }

    function renderDoorList() {
      const list = $("doorList");
      list.replaceChildren();
      if (!state.doors.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "아직 추가된 출입문이 없습니다.";
        list.appendChild(empty);
        return;
      }
      state.doors.forEach((door) => {
        const row = document.createElement("div");
        row.className = "door-list-row";
        const select = document.createElement("button");
        select.type = "button";
        const wallName = door.wall === "back" ? "뒷벽" : "왼쪽 벽";
        select.textContent = `${door.name} · ${wallName} ${door.offset} mm · ${door.width} x ${door.height} mm`;
        select.addEventListener("click", () => selectDoor(door.id));
        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "danger";
        remove.textContent = "삭제";
        remove.setAttribute("aria-label", `${door.name} 삭제`);
        remove.addEventListener("click", () => removeDoor(door.id));
        row.append(select, remove);
        list.appendChild(row);
      });
    }

    function renderDoorEditor() {
      const door = selectedDoor();
      $("doorEditor").classList.toggle("hidden", !door);
      $("doorEditorEmpty").classList.toggle("hidden", !!door);
      if (!door) return;
      $("edName").value = door.name;
      $("edWall").value = door.wall;
      $("edOffset").value = door.offset;
      $("edWidth").value = door.width;
      $("edHeight").value = door.height;
      $("edHinge").value = door.hinge;
      $("edSwing").value = door.swing;
      $("edColor").value = door.color;
    }

    function selectedItem() {
      return state.items.find((item) => item.id === state.selectedId);
    }

    function selectedDoor() {
      return state.doors.find((door) => door.id === state.selectedDoorId);
    }

    function selectItem(id) {
      state.selectedId = id;
      state.selectedDoorId = null;
      state.mode = "2d";
      state.status = "";
      render();
    }

    function selectDoor(id) {
      state.selectedDoorId = id;
      state.selectedId = null;
      state.mode = "2d";
      state.status = "";
      render();
    }

    function removeDoor(id) {
      state.doors = state.doors.filter((door) => door.id !== id);
      if (state.selectedDoorId === id) state.selectedDoorId = state.doors[0]?.id || null;
      state.status = "출입문 삭제됨";
      render();
    }

    function doorOverlaps(candidate, ignoreId = null) {
      return state.doors.some((door) => door.id !== ignoreId && door.wall === candidate.wall &&
        candidate.offset < door.offset + door.width && candidate.offset + candidate.width > door.offset);
    }

    function itemsOverlap(a, b) {
      return a.x < b.x + b.width && a.x + a.width > b.x && a.y < b.y + b.depth && a.y + a.depth > b.y;
    }

    function hasOverlap(item) {
      return state.items.some((other) => other.id !== item.id && itemsOverlap(item, other));
    }

    function countOverlaps() {
      let count = 0;
      for (let i = 0; i < state.items.length; i += 1) {
        for (let j = i + 1; j < state.items.length; j += 1) {
          if (itemsOverlap(state.items[i], state.items[j])) count += 1;
        }
      }
      return count;
    }

    function readNumber(id, fallback) {
      const value = Number($(id).value);
      return Number.isFinite(value) ? snap(value) : fallback;
    }

    async function loadThree() {
      try {
        const THREE = await import("three");
        const { OrbitControls } = await import("three/addons/controls/OrbitControls.js");
        const { GLTFLoader } = await import("three/addons/loaders/GLTFLoader.js");
        threeApp = createThreeApp(THREE, OrbitControls, GLTFLoader);
        $("threeStatus").classList.add("hidden");
        threeApp.rebuild();
        threeApp.restoreView(state.view);
        if (state.mode === "3d") requestAnimationFrame(threeApp.resize);
      } catch (error) {
        $("threeStatus").textContent = "3D 엔진을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침하세요.";
        console.error("Three.js load failed", error);
      }
    }

    function createThreeApp(THREE, OrbitControls, GLTFLoader) {
      const canvas = $("threeCanvas");
      const viewer = $("viewer3d");
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xf2f3ef);
      scene.fog = new THREE.Fog(0xf2f3ef, 9000, 22000);

      const camera = new THREE.PerspectiveCamera(42, 1, 10, 50000);
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFShadowMap;

      const controls = new OrbitControls(camera, canvas);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.enablePan = true;
      controls.screenSpacePanning = true;
      controls.minPolarAngle = 0.08;
      controls.maxPolarAngle = Math.PI * 0.49;
      controls.touches.ONE = THREE.TOUCH.ROTATE;
      controls.touches.TWO = THREE.TOUCH.DOLLY_PAN;

      const hemi = new THREE.HemisphereLight(0xffffff, 0x8a8174, 2.2);
      scene.add(hemi);
      const sun = new THREE.DirectionalLight(0xffffff, 3.4);
      sun.position.set(5000, 7000, 4500);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.camera.near = 100;
      sun.shadow.camera.far = 20000;
      scene.add(sun);

      const roomRoot = new THREE.Group();
      scene.add(roomRoot);
      const gltfLoader = new GLTFLoader();
      const modelCache = new Map();
      let dirty = true;
      let baseDistance = 1;
      let buildVersion = 0;
      let pendingModels = 0;

      function material(color, roughness = 0.78) {
        return new THREE.MeshStandardMaterial({ color, roughness, metalness: 0.03 });
      }

      function addBox(width, height, depth, x, y, z, color, options = {}) {
        if (width <= 0 || height <= 0 || depth <= 0) return null;
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), material(color, options.roughness));
        mesh.position.set(x, y, z);
        mesh.castShadow = options.castShadow !== false;
        mesh.receiveShadow = options.receiveShadow !== false;
        roomRoot.add(mesh);
        return mesh;
      }

      function addGrid() {
        const positions = [];
        const minor = [];
        for (let x = 0; x <= state.room.width; x += 10) {
          (x % 100 === 0 ? positions : minor).push(x, 2, 0, x, 2, state.room.depth);
        }
        for (let z = 0; z <= state.room.depth; z += 10) {
          (z % 100 === 0 ? positions : minor).push(0, 2, z, state.room.width, 2, z);
        }
        [[minor, 0xc9ceca, 0.22], [positions, 0x8e9994, 0.38]].forEach(([data, color, opacity]) => {
          const geometry = new THREE.BufferGeometry();
          geometry.setAttribute("position", new THREE.Float32BufferAttribute(data, 3));
          const lines = new THREE.LineSegments(geometry, new THREE.LineBasicMaterial({ color, transparent: true, opacity }));
          roomRoot.add(lines);
        });
      }

      function addWallPanel(wall, start, span, y, height) {
        if (span <= 0 || height <= 0) return;
        const thickness = 60;
        if (wall === "back") {
          addBox(span, height, thickness, start + span / 2, y + height / 2, -thickness / 2, 0xfffaf1, { castShadow: false });
        } else {
          addBox(thickness, height, span, -thickness / 2, y + height / 2, start + span / 2, 0xfffaf1, { castShadow: false });
        }
      }

      function addWall(wall) {
        const doors = state.doors.filter((door) => door.wall === wall).sort((a, b) => a.offset - b.offset);
        let cursor = 0;
        doors.forEach((door) => {
          addWallPanel(wall, cursor, Math.max(0, door.offset - cursor), 0, state.room.height);
          addWallPanel(wall, door.offset, door.width, door.height, state.room.height - door.height);
          addThreeDoor(door);
          cursor = Math.max(cursor, door.offset + door.width);
        });
        addWallPanel(wall, cursor, Math.max(0, wallLength(wall) - cursor), 0, state.room.height);
      }

      function addThreeDoor(door) {
        const group = new THREE.Group();
        const angle = THREE.MathUtils.degToRad(55) * (door.swing === "in" ? 1 : -1);
        let leaf;
        if (door.wall === "back") {
          const direction = door.hinge === "start" ? 1 : -1;
          group.position.set(door.hinge === "start" ? door.offset : door.offset + door.width, door.height / 2, 0);
          group.rotation.y = angle * (door.hinge === "start" ? -1 : 1);
          leaf = new THREE.Mesh(new THREE.BoxGeometry(door.width, door.height, 40), material(door.color, 0.62));
          leaf.position.x = direction * door.width / 2;
          const knob = new THREE.Mesh(new THREE.SphereGeometry(28, 18, 12), material(0x263234, 0.35));
          knob.position.set(direction * door.width * 0.4, 0, 34);
          leaf.add(knob);
        } else {
          const direction = door.hinge === "start" ? 1 : -1;
          group.position.set(0, door.height / 2, door.hinge === "start" ? door.offset : door.offset + door.width);
          group.rotation.y = angle * (door.hinge === "start" ? 1 : -1);
          leaf = new THREE.Mesh(new THREE.BoxGeometry(40, door.height, door.width), material(door.color, 0.62));
          leaf.position.z = direction * door.width / 2;
          const knob = new THREE.Mesh(new THREE.SphereGeometry(28, 18, 12), material(0x263234, 0.35));
          knob.position.set(34, 0, direction * door.width * 0.4);
          leaf.add(knob);
        }
        leaf.castShadow = true;
        leaf.receiveShadow = true;
        group.add(leaf);
        roomRoot.add(group);
      }

      function makeLabel(text, width) {
        const labelCanvas = document.createElement("canvas");
        labelCanvas.width = 512;
        labelCanvas.height = 128;
        const context = labelCanvas.getContext("2d");
        context.fillStyle = "rgba(255,253,248,.94)";
        context.beginPath();
        if (context.roundRect) context.roundRect(8, 8, 496, 112, 20);
        else context.rect(8, 8, 496, 112);
        context.fill();
        context.strokeStyle = "rgba(31,37,39,.34)";
        context.lineWidth = 6;
        context.stroke();
        context.fillStyle = "#1f2527";
        context.font = "700 48px Segoe UI, sans-serif";
        context.textAlign = "center";
        context.textBaseline = "middle";
        const clipped = text.length > 14 ? `${text.slice(0, 13)}…` : text;
        context.fillText(clipped, 256, 65);
        const texture = new THREE.CanvasTexture(labelCanvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: true }));
        const spriteWidth = Math.min(720, Math.max(300, width * 0.72));
        sprite.scale.set(spriteWidth, spriteWidth / 4, 1);
        return sprite;
      }

      function addFurnitureBox(item) {
        const mesh = addBox(
          item.width,
          item.height,
          item.depth,
          item.x + item.width / 2,
          (item.z || 0) + item.height / 2,
          item.y + item.depth / 2,
          item.color,
          { roughness: 0.7 }
        );
        if (!mesh) return null;
        const edges = new THREE.LineSegments(
          new THREE.EdgesGeometry(mesh.geometry),
          new THREE.LineBasicMaterial({ color: 0x34413f, transparent: true, opacity: 0.7 })
        );
        mesh.add(edges);
        return mesh;
      }

      function addFurnitureLabel(item) {
        const label = makeLabel(item.name, item.width);
        label.position.set(item.x + item.width / 2, (item.z || 0) + item.height + 120, item.y + item.depth / 2);
        roomRoot.add(label);
      }

      function loadModel(modelKey) {
        if (!modelCache.has(modelKey)) {
          const promise = gltfLoader.loadAsync(furnitureModels[modelKey].url)
            .then((gltf) => gltf.scene)
            .catch((error) => {
              modelCache.delete(modelKey);
              throw error;
            });
          modelCache.set(modelKey, promise);
        }
        return modelCache.get(modelKey);
      }

      function cloneModel(template, item) {
        const model = template.clone(true);
        model.traverse((child) => {
          if (!child.isMesh) return;
          child.geometry = child.geometry.clone();
          const source = Array.isArray(child.material) ? child.material : [child.material];
          const cloned = source.map((entry) => {
            const next = entry.clone();
            next.userData.sharedModelMaps = true;
            if (item.finish === "tint" && next.color) next.color.set(item.color);
            return next;
          });
          child.material = Array.isArray(child.material) ? cloned : cloned[0];
          child.castShadow = true;
          child.receiveShadow = true;
        });
        return model;
      }

      function fitModelToFurniture(template, item) {
        const model = cloneModel(template, item);
        const sourceBounds = new THREE.Box3().setFromObject(model);
        const size = sourceBounds.getSize(new THREE.Vector3());
        const center = sourceBounds.getCenter(new THREE.Vector3());
        if (size.x <= 0 || size.y <= 0 || size.z <= 0) throw new Error("GLB model has no measurable volume");

        model.position.set(-center.x, -sourceBounds.min.y, -center.z);
        const fitted = new THREE.Group();
        fitted.add(model);
        const quarterTurn = item.rotation % 180 !== 0;
        fitted.scale.set(
          (quarterTurn ? item.depth : item.width) / size.x,
          item.height / size.y,
          (quarterTurn ? item.width : item.depth) / size.z
        );
        fitted.rotation.y = THREE.MathUtils.degToRad(item.rotation || 0);
        fitted.position.set(item.x + item.width / 2, item.z || 0, item.y + item.depth / 2);
        roomRoot.add(fitted);
      }

      async function addFurniture(item, version) {
        addFurnitureLabel(item);
        if (!furnitureModels[item.model]) {
          addFurnitureBox(item);
          return;
        }

        pendingModels += 1;
        $("threeStatus").textContent = "GLB 가구 모델을 불러오는 중입니다.";
        $("threeStatus").classList.remove("hidden");
        try {
          const template = await loadModel(item.model);
          if (version !== buildVersion) return;
          fitModelToFurniture(template, item);
        } catch (error) {
          if (version !== buildVersion) return;
          addFurnitureBox(item);
          state.status = `${item.name} GLB 로딩 실패 · 박스로 표시`;
          console.error("GLB furniture load failed", error);
        } finally {
          if (version === buildVersion) {
            pendingModels = Math.max(0, pendingModels - 1);
            if (pendingModels === 0) $("threeStatus").classList.add("hidden");
          }
        }
      }

      function disposeObject(object) {
        object.traverse((child) => {
          child.geometry?.dispose();
          const materials = Array.isArray(child.material) ? child.material : [child.material];
          materials.filter(Boolean).forEach((entry) => {
            if (!entry.userData.sharedModelMaps) entry.map?.dispose();
            entry.dispose();
          });
        });
      }

      function rebuild() {
        if (!dirty) return;
        buildVersion += 1;
        pendingModels = 0;
        const version = buildVersion;
        roomRoot.children.forEach(disposeObject);
        roomRoot.clear();
        addBox(state.room.width, 20, state.room.depth, state.room.width / 2, -10, state.room.depth / 2, 0xf8f6ef, { castShadow: false });
        addGrid();
        addWall("back");
        addWall("left");
        state.items.forEach((item) => addFurniture(item, version));
        const span = Math.max(state.room.width, state.room.depth, state.room.height);
        controls.minDistance = Math.max(250, span * 0.12);
        controls.maxDistance = span * 5;
        sun.shadow.camera.left = -span * 1.5;
        sun.shadow.camera.right = span * 1.5;
        sun.shadow.camera.top = span * 1.5;
        sun.shadow.camera.bottom = -span * 1.5;
        sun.shadow.camera.updateProjectionMatrix();
        dirty = false;
      }

      function resetView() {
        const span = Math.max(state.room.width, state.room.depth, state.room.height);
        controls.target.set(state.room.width / 2, state.room.height * 0.3, state.room.depth / 2);
        camera.position.set(state.room.width * 1.2, Math.max(state.room.height * 1.15, span), state.room.depth * 1.35);
        camera.near = Math.max(1, span / 1000);
        camera.far = span * 12;
        camera.updateProjectionMatrix();
        controls.update();
        baseDistance = camera.position.distanceTo(controls.target);
        updateZoomValue();
      }

      function updateZoomValue() {
        const distance = Math.max(1, camera.position.distanceTo(controls.target));
        $("zoomValue").textContent = `${Math.round(baseDistance / distance * 100)}%`;
      }

      function zoom(factor) {
        const direction = camera.position.clone().sub(controls.target);
        const distance = Math.min(controls.maxDistance, Math.max(controls.minDistance, direction.length() / factor));
        camera.position.copy(controls.target).add(direction.normalize().multiplyScalar(distance));
        controls.update();
        updateZoomValue();
      }

      function resize() {
        const width = viewer.clientWidth;
        const height = viewer.clientHeight;
        if (width < 2 || height < 2) return;
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      }

      function captureView() {
        return {
          camera: camera.position.toArray(),
          target: controls.target.toArray()
        };
      }

      function restoreView(view) {
        if (!Array.isArray(view?.camera) || !Array.isArray(view?.target)) return false;
        camera.position.fromArray(view.camera);
        controls.target.fromArray(view.target);
        controls.update();
        updateZoomValue();
        return true;
      }

      controls.addEventListener("start", () => viewer.classList.add("dragging"));
      controls.addEventListener("end", () => viewer.classList.remove("dragging"));
      controls.addEventListener("change", updateZoomValue);
      const observer = new ResizeObserver(resize);
      observer.observe(viewer);
      resetView();
      resize();

      function animate() {
        if (state.mode === "3d") {
          controls.update();
          renderer.render(scene, camera);
        }
        requestAnimationFrame(animate);
      }
      animate();

      return {
        markDirty() { dirty = true; },
        rebuild,
        resize,
        resetView,
        zoom,
        captureView,
        restoreView
      };
    }

    $("applyRoom").addEventListener("click", () => {
      state.room.width = Math.max(100, readNumber("roomWidth", state.room.width));
      state.room.depth = Math.max(100, readNumber("roomDepth", state.room.depth));
      state.room.height = Math.max(100, readNumber("roomHeight", state.room.height));
      state.items.forEach(clampItem);
      state.doors.forEach(clampDoor);
      state.status = "";
      setScaleToFit();
    });

    $("fitRoom").addEventListener("click", setScaleToFit);

    $("addFurniture").addEventListener("click", () => {
      const item = clampItem({
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
        name: $("fName").value.trim() || "가구",
        width: Math.min(readNumber("fWidth", 800), state.room.width),
        depth: Math.min(readNumber("fDepth", 450), state.room.depth),
        height: Math.min(readNumber("fHeight", 900), state.room.height),
        z: readNumber("fZ", 0),
        color: $("fColor").value,
        model: $("fModel").value,
        finish: $("fFinish").value,
        rotation: 0,
        x: 0,
        y: 0
      });
      state.items.push(item);
      state.selectedId = item.id;
      state.selectedDoorId = null;
      state.status = hasOverlap(item) ? "겹침 감지" : "";
      render();
    });

    $("addDoor").addEventListener("click", () => {
      const door = clampDoor({
        id: crypto.randomUUID ? crypto.randomUUID() : `door-${Date.now()}`,
        name: $("dName").value.trim() || "출입문",
        wall: $("dWall").value,
        offset: readNumber("dOffset", 300),
        width: readNumber("dWidth", 900),
        height: readNumber("dHeight", 2100),
        hinge: $("dHinge").value,
        swing: $("dSwing").value,
        color: $("dColor").value
      });
      if (doorOverlaps(door)) {
        state.status = "같은 벽의 출입문과 겹쳐 추가되지 않음";
        render();
        return;
      }
      state.doors.push(door);
      state.selectedDoorId = door.id;
      state.selectedId = null;
      state.status = "출입문 추가됨";
      render();
    });

    $("updateFurniture").addEventListener("click", () => {
      const item = selectedItem();
      if (!item) return;
      item.name = $("eName").value.trim() || "가구";
      item.x = readNumber("eX", item.x);
      item.y = readNumber("eY", item.y);
      item.width = Math.min(readNumber("eWidth", item.width), state.room.width);
      item.depth = Math.min(readNumber("eDepth", item.depth), state.room.depth);
      item.height = Math.min(readNumber("eHeight", item.height), state.room.height);
      item.z = readNumber("eZ", item.z || 0);
      item.color = $("eColor").value;
      item.model = $("eModel").value;
      item.finish = $("eFinish").value;
      clampItem(item);
      state.status = hasOverlap(item) ? "겹침 감지" : "";
      render();
    });

    $("rotateFurniture").addEventListener("click", () => {
      const item = selectedItem();
      if (!item) return;
      const nextWidth = item.depth;
      item.depth = item.width;
      item.width = nextWidth;
      item.rotation = ((item.rotation || 0) + 90) % 360;
      clampItem(item);
      state.status = hasOverlap(item) ? "겹침 감지" : "90도 회전";
      render();
    });

    $("deleteFurniture").addEventListener("click", () => {
      state.items = state.items.filter((item) => item.id !== state.selectedId);
      state.selectedId = state.items[0]?.id || null;
      state.status = "삭제됨";
      render();
    });

    $("updateDoor").addEventListener("click", () => {
      const door = selectedDoor();
      if (!door) return;
      const previous = { ...door };
      door.name = $("edName").value.trim() || "출입문";
      door.wall = $("edWall").value;
      door.offset = readNumber("edOffset", door.offset);
      door.width = readNumber("edWidth", door.width);
      door.height = readNumber("edHeight", door.height);
      door.hinge = $("edHinge").value;
      door.swing = $("edSwing").value;
      door.color = $("edColor").value;
      clampDoor(door);
      if (doorOverlaps(door, door.id)) {
        Object.assign(door, previous);
        state.status = "같은 벽의 출입문과 겹쳐 수정되지 않음";
        render();
        return;
      }
      state.status = "출입문 수정됨";
      render();
    });

    $("deleteDoor").addEventListener("click", () => {
      const door = selectedDoor();
      if (door) removeDoor(door.id);
    });

    $("savePlan").addEventListener("click", () => {
      if (threeApp) state.view = threeApp.captureView();
      localStorage.setItem(storageKey, JSON.stringify({ room: state.room, items: state.items, doors: state.doors, view: state.view }));
      state.status = "저장됨";
      render();
    });

    $("loadPlan").addEventListener("click", () => {
      const saved = localStorage.getItem(storageKey);
      if (!saved) {
        state.status = "저장 없음";
        render();
        return;
      }
      try {
        const parsed = JSON.parse(saved);
        state.room = parsed.room || state.room;
        state.items = Array.isArray(parsed.items) ? parsed.items.map(clampItem) : [];
        state.doors = Array.isArray(parsed.doors) ? parsed.doors.map(clampDoor) : [];
        state.view = parsed.view || state.view;
        state.selectedId = state.items[0]?.id || null;
        state.selectedDoorId = null;
        $("roomWidth").value = state.room.width;
        $("roomDepth").value = state.room.depth;
        $("roomHeight").value = state.room.height;
        state.status = "불러옴";
        setScaleToFit();
        requestAnimationFrame(() => {
          threeApp?.rebuild();
          if (!threeApp?.restoreView(state.view)) threeApp?.resetView();
        });
      } catch {
        state.status = "불러오기 실패";
        render();
      }
    });

    $("resetPlan").addEventListener("click", () => {
      state.items = [];
      state.doors = [];
      state.selectedId = null;
      state.selectedDoorId = null;
      localStorage.removeItem(storageKey);
      state.status = "초기화됨";
      render();
    });

    $("tab2d").addEventListener("click", () => { state.mode = "2d"; render(); });
    $("tab3d").addEventListener("click", () => { state.mode = "3d"; render(); });

    $("resetView").addEventListener("click", () => {
      threeApp?.resetView();
      state.status = "보기 초기화";
      render();
    });

    $("zoomOut").addEventListener("click", () => threeApp?.zoom(1 / 1.2));
    $("zoomIn").addEventListener("click", () => threeApp?.zoom(1.2));

    function startDrag(event) {
      const id = event.currentTarget.dataset.id;
      const item = state.items.find((entry) => entry.id === id);
      if (!item) return;
      state.selectedId = id;
      const startX = event.clientX;
      const startY = event.clientY;
      const originX = item.x;
      const originY = item.y;
      event.currentTarget.setPointerCapture(event.pointerId);

      const move = (moveEvent) => {
        const dx = (moveEvent.clientX - startX) / state.scale;
        const dy = (moveEvent.clientY - startY) / state.scale;
        item.x = originX + dx;
        item.y = originY + dy;
        clampItem(item);
        render();
      };

      const end = () => {
        window.removeEventListener("pointermove", move);
        window.removeEventListener("pointerup", end);
      };

      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", end);
    }

    function startResize(event) {
      event.preventDefault();
      event.stopPropagation();
      const item = state.items.find((entry) => entry.id === event.currentTarget.parentElement.dataset.id);
      if (!item) return;
      const corner = event.currentTarget.dataset.corner;
      const startX = event.clientX;
      const startY = event.clientY;
      const origin = { x: item.x, y: item.y, width: item.width, depth: item.depth };
      const right = origin.x + origin.width;
      const bottom = origin.y + origin.depth;

      const move = (moveEvent) => {
        const dx = (moveEvent.clientX - startX) / state.scale;
        const dy = (moveEvent.clientY - startY) / state.scale;
        if (moveEvent.shiftKey) {
          const rawWidth = origin.width + (corner.includes("w") ? -dx : dx);
          const rawDepth = origin.depth + (corner.includes("n") ? -dy : dy);
          const widthScale = rawWidth / origin.width;
          const depthScale = rawDepth / origin.depth;
          const requestedScale = Math.abs(widthScale - 1) >= Math.abs(depthScale - 1) ? widthScale : depthScale;
          const maxWidth = corner.includes("w") ? right : state.room.width - origin.x;
          const maxDepth = corner.includes("n") ? bottom : state.room.depth - origin.y;
          const minScale = Math.max(10 / origin.width, 10 / origin.depth);
          const maxScale = Math.min(maxWidth / origin.width, maxDepth / origin.depth);
          const ratio = Math.min(maxScale, Math.max(minScale, requestedScale));
          item.width = Math.max(10, snap(origin.width * ratio));
          item.depth = Math.max(10, snap(origin.depth * ratio));
          item.x = corner.includes("w") ? right - item.width : origin.x;
          item.y = corner.includes("n") ? bottom - item.depth : origin.y;
          state.status = hasOverlap(item) ? "겹침 감지" : "비율 유지 크기 조절 중";
          render();
          return;
        }
        if (corner.includes("w")) {
          item.x = Math.min(right - 10, Math.max(0, snap(origin.x + dx)));
          item.width = right - item.x;
        } else {
          item.width = Math.min(state.room.width - origin.x, Math.max(10, snap(origin.width + dx)));
        }
        if (corner.includes("n")) {
          item.y = Math.min(bottom - 10, Math.max(0, snap(origin.y + dy)));
          item.depth = bottom - item.y;
        } else {
          item.depth = Math.min(state.room.depth - origin.y, Math.max(10, snap(origin.depth + dy)));
        }
        state.status = hasOverlap(item) ? "겹침 감지" : "크기 조절 중";
        render();
      };

      const end = () => {
        state.status = hasOverlap(item) ? "겹침 감지" : "크기 조절됨";
        render();
        window.removeEventListener("pointermove", move);
        window.removeEventListener("pointerup", end);
        window.removeEventListener("pointercancel", end);
      };

      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", end);
      window.addEventListener("pointercancel", end);
    }

    window.addEventListener("resize", setScaleToFit);
    setScaleToFit();
    loadThree();
  </script>
</body>
</html>
